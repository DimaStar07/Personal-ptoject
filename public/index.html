<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Вероятностные сценарии рынка</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar">
        <div class="brand-block">
          <div class="brand">VA</div>
          <div>
            <h1>Вероятностные сценарии</h1>
            <p>исторические аналогии</p>
          </div>
        </div>

        <nav class="sidebar-section nav">
          <button class="nav-btn active" data-tab="today">Рынок сегодня</button>
          <button class="nav-btn" data-tab="asset">Актив</button>
          <button class="nav-btn" data-tab="event">Событие</button>
          <button class="nav-btn" data-tab="analogs">Аналоги</button>
          <button class="nav-btn" data-tab="status">Статус загрузки</button>
        </nav>

        <div class="sidebar-section">
          <h2>Активы</h2>
          <div id="asset-list" class="asset-list"></div>
        </div>
      </aside>

      <main class="main-panel">
        <header class="topbar">
          <div>
            <p class="eyebrow">Информационная аналитическая платформа</p>
            <h2 id="page-title">Рынок сегодня</h2>
          </div>
          <button id="refresh-button">Обновить данные</button>
        </header>

        <section class="disclaimer" aria-live="polite">
          Вероятности — модельные аналитические оценки на основе исторических аналогий, не гарантия и не персональная инвестиционная рекомендация.
        </section>

        <section id="view-today" class="view active"></section>
        <section id="view-asset" class="view"></section>
        <section id="view-event" class="view"></section>
        <section id="view-analogs" class="view"></section>
        <section id="view-status" class="view"></section>
      </main>
    </div>

    <script src="/app.js"></script>
  </body>
</html>
